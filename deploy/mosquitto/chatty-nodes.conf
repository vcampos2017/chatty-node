# Chatty's node network: a small MQTT broker the other nodes check in with.
# Installed to /etc/mosquitto/conf.d/ by scripts/install_mqtt.sh.
#
# Open to the home network and Tailscale without a password, like the nodes'
# /status pages. Don't forward port 1883 on the router.
listener 1883
allow_anonymous true
# Keep the nodes' last status and readings across broker restarts
persistence true
