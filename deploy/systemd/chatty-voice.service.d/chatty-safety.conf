# Added to chatty-voice by scripts/install_voice_service.sh. It changes nothing
# about how she starts (user, Python, folder stay as in chatty-voice.service);
# it only adds:
#   - restart after any crash or stop, 5 s later, without giving up
#   - a watchdog: her main loop says "still alive" every few seconds; if she
#     freezes for 5 minutes (a stuck model call, a hung sound device) systemd
#     restarts her. Her longest normal wait (a slow answer) is about 1.5 minutes.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=5
WatchdogSec=300
NotifyAccess=all
