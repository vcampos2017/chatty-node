# Runs Chatty's tests on every pull request and every push to main, for free
# (GitHub Actions is free for public repositories). Only numpy is installed (her
# sound code uses it); the tests bring stand-ins for the Pi's hardware and other
# packages. Two Pythons: 3.11 (Raspberry Pi OS Bookworm) and 3.13 (Trixie).
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install numpy
        run: python -m pip install --quiet numpy
      - name: Syntax check (every Python file)
        run: python -m compileall -q src scripts tests app
      - name: Tests
        run: python scripts/run_tests.py
